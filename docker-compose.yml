# PostgreSQL local pour le Pilote, si Homebrew / Postgres.app ne sont pas installés : `docker compose up -d`.
# Rôle `pilote` / `pilote`, bases `pilote_dev` et `pilote_test` (créée au premier `npm test` si le rôle a CREATEDB).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pilote
      POSTGRES_PASSWORD: pilote
      POSTGRES_DB: pilote_dev
    ports:
      - "5432:5432"
    volumes:
      - pilote-pg:/var/lib/postgresql/data
volumes:
  pilote-pg:
