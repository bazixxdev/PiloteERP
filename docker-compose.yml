# PostgreSQL STRICTEMENT LOCAL pour le développement : `docker compose up -d`.
# Ce fichier n'est pas une configuration de recette ou de production. Les valeurs
# par défaut sont de développement uniquement et peuvent être surchargées via .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pilote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilote}
      POSTGRES_DB: ${POSTGRES_DB:-pilote_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pilote-pg:/var/lib/postgresql/data
volumes:
  pilote-pg:
