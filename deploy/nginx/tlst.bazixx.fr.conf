# Pilote — instance TLST (Tiers-Lieu Nourricier du Sud Touraine), hébergée sur le VPS Bazixx (srv771239, alias ssh `bazixx-vps`).
# Avant la première mise en ligne (hors lot I) : DNS tlst.bazixx.fr → bazixx-vps, puis `certbot --nginx -d tlst.bazixx.fr`.
# Convention outilcli : l'application vit sous /outilcli/tlst/pilote (basePath Next), proxifiée vers le
# process systemd `pilote@tlst` sur 127.0.0.1:3003. La racine redirige vers l'outil.
#
# Version HTTP nue : certbot ajoute lui-même le bloc 443 et la redirection au premier
# `certbot --nginx -d tlst.bazixx.fr`. Ensuite, ne pas recopier ce fichier par-dessus celui du serveur.

server {
  server_name tlst.bazixx.fr;

  client_max_body_size 8m; # pièces jointes légères : 5 Mo côté application

  access_log /var/log/nginx/tlst.access.log;
  error_log  /var/log/nginx/tlst.error.log warn;

  # Démo client : hors des moteurs de recherche.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Rideau devant la vitrine (ce n'est pas l'authentification du produit : le sélecteur « Je suis… » reste la démo).
  auth_basic "Pilote · TLST";
  auth_basic_user_file /etc/nginx/.htpasswd-tlst;

  # Certbot doit se valider sans mot de passe, sinon le renouvellement échoue en silence.
  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/html;
  }

  # L'API de connexion passe sans rideau : Safari n'envoie pas les identifiants htpasswd sur les requêtes fetch, et le 401 de
  # nginx faisait réapparaître la fenêtre du rideau à chaque tentative (18/09). L'application limite elle-même les essais.
  location ~ ^/outilcli/tlst/pilote/api/auth/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Les flux agenda (.ics) sont lus par Outlook, sans mot de passe : leur jeton fait office de secret.
  location ~ ^/outilcli/tlst/pilote/api/agenda/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / { return 302 /outilcli/tlst/pilote/portefeuille; }
  location = /outilcli/tlst/pilote { return 302 /outilcli/tlst/pilote/portefeuille; }

  location /outilcli/tlst/pilote {
    if (-f /var/www/maintenance/ACTIF-tlst) { return 503; }
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;

    # L'app est morte ou redémarre : page de maintenance, jamais un 502 nu.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    error_page 502 503 504 =503 /__maintenance.html;
  }

  # Servie hors de l'app : elle doit survivre à sa panne.
  location = /__maintenance.html {
    auth_basic off;
    root /var/www/maintenance;
    internal;
  }
}
