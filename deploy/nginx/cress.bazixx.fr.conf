# Pilote — prototype CRESS Centre-Val de Loire, démo hébergée sur le VPS Bazixx (srv771239, alias ssh `bazixx-vps`).
# Convention outilcli : l'application vit sous /outilcli/cress/pilote (basePath Next), proxifiée vers le
# process systemd `cress-pilote` sur 127.0.0.1:3002. La racine redirige vers l'outil.
#
# Version HTTP nue : certbot ajoute lui-même le bloc 443 et la redirection au premier
# `certbot --nginx -d cress.bazixx.fr`. Ensuite, ne pas recopier ce fichier par-dessus celui du serveur.

server {
  server_name cress.bazixx.fr;

  client_max_body_size 8m; # pièces jointes légères : 5 Mo côté application

  access_log /var/log/nginx/cress.access.log;
  error_log  /var/log/nginx/cress.error.log warn;

  # Démo client : hors des moteurs de recherche.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Rideau devant la vitrine (ce n'est pas l'authentification du produit : le sélecteur « Je suis… » reste la démo).
  auth_basic "Pilote · CRESS";
  auth_basic_user_file /etc/nginx/.htpasswd-cress;

  # Certbot doit se valider sans mot de passe, sinon le renouvellement échoue en silence.
  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/html;
  }

  # Les flux agenda (.ics) sont lus par Outlook, sans mot de passe : leur jeton fait office de secret.
  location ~ ^/outilcli/cress/pilote/api/agenda/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / { return 302 /outilcli/cress/pilote/portefeuille; }
  location = /outilcli/cress/pilote { return 302 /outilcli/cress/pilote/portefeuille; }

  location /outilcli/cress/pilote {
    if (-f /var/www/maintenance/ACTIF-cress) { return 503; }
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;

    # L'app est morte ou redémarre : page de maintenance, jamais un 502 nu.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    error_page 502 503 504 =503 /__maintenance.html;
  }

  # Servie hors de l'app : elle doit survivre à sa panne.
  location = /__maintenance.html {
    auth_basic off;
    root /var/www/maintenance;
    internal;
  }
}
