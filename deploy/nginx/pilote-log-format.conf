# À inclure dans le bloc http {} de nginx.conf avant les vhosts Pilote.
# $uri exclut la query string. Les chemins ICS sont normalisés avant journalisation
# afin que le bearer token du chemin ne soit pas conservé.
map $uri $pilote_log_uri {
  default $uri;
  ~^/outilcli/[^/]+/pilote/api/agenda/ /outilcli/[instance]/pilote/api/agenda/[ics-token-redacted].ics;
}

log_format pilote_safe '$remote_addr - $remote_user [$time_local] "$request_method $pilote_log_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent" "$request_id"';
